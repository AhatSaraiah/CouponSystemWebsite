name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The API host is injected at build time. Set the repository variable
      # API_BASE_URL (Settings > Secrets and variables > Actions > Variables) to the
      # deployed backend, for example https://coupon-system-api.onrender.com.
      - name: Point the app at the deployed API
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          URL="${API_BASE_URL:-http://localhost:9096}"
          cat > src/environments/environment.prod.ts <<EOF
          export const environment = {
            production: true,
            apiBaseUrl: '${URL}',
          };
          EOF
          echo "Building against ${URL}"

      - name: Build for Pages
        run: npm run build -- --base-href "/${GITHUB_REPOSITORY#*/}/"

      # GitHub Pages has no SPA rewrite, so deep links fall back to 404.html
      - name: Add SPA fallback
        run: cp dist/CouponSystemWebsite/index.html dist/CouponSystemWebsite/404.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/CouponSystemWebsite

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
