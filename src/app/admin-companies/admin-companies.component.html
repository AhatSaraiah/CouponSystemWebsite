<div class="container">
    <h2>Manage Companies</h2>

    <table class="table-container">
        <thead>
            <tr>
                <th>Name</th>
                <th>Email</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr *ngFor="let company of companies$ | async">
                <td>{{company.name}}</td>
                <td>{{company.email}}</td>
                <td>
                    <button mat-raised-button color="warn" (click)="deleteCompany(company.id)">Delete</button>
                </td>
            </tr>
        </tbody>
    </table>
</div>
