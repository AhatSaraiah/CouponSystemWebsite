<div class="container">
    <div class="header-actions">
        <h2>Company Coupons</h2>
        <button mat-raised-button color="primary" (click)="toggleForm()">
            {{ showForm ? 'Cancel' : 'Add New Coupon' }}
        </button>
    </div>

    <!-- Add Coupon Form -->
    <div *ngIf="showForm" class="form-container">
        <form [formGroup]="couponForm" (ngSubmit)="onSubmit()">
            <div class="form-row">
                <mat-form-field appearance="outline">
                    <mat-label>Title</mat-label>
                    <input matInput formControlName="title">
                </mat-form-field>

                <mat-form-field appearance="outline">
                    <mat-label>Category</mat-label>
                    <mat-select formControlName="category">
                        <mat-option *ngFor="let cat of categories" [value]="cat">
                            {{cat}}
                        </mat-option>
                    </mat-select>
                </mat-form-field>
            </div>

            <div class="form-row">
                <mat-form-field appearance="outline" class="full-width">
                    <mat-label>Description</mat-label>
                    <textarea matInput formControlName="description"></textarea>
                </mat-form-field>
            </div>

            <div class="form-row">
                <mat-form-field appearance="outline">
                    <mat-label>Start Date</mat-label>
                    <input matInput [matDatepicker]="startPicker" formControlName="startDate">
                    <mat-datepicker-toggle matSuffix [for]="startPicker"></mat-datepicker-toggle>
                    <mat-datepicker #startPicker></mat-datepicker>
                </mat-form-field>

                <mat-form-field appearance="outline">
                    <mat-label>End Date</mat-label>
                    <input matInput [matDatepicker]="endPicker" formControlName="endDate">
                    <mat-datepicker-toggle matSuffix [for]="endPicker"></mat-datepicker-toggle>
                    <mat-datepicker #endPicker></mat-datepicker>
                </mat-form-field>
            </div>

            <div class="form-row">
                <mat-form-field appearance="outline">
                    <mat-label>Amount</mat-label>
                    <input matInput type="number" formControlName="amount">
                </mat-form-field>

                <mat-form-field appearance="outline">
                    <mat-label>Price</mat-label>
                    <input matInput type="number" formControlName="price">
                </mat-form-field>
            </div>

            <button mat-raised-button color="accent" type="submit" [disabled]="!couponForm.valid">
                Create Coupon
            </button>
        </form>
    </div>

    <!-- Coupons Grid -->
    <div class="coupons-grid">
        <div class="coupon-card" *ngFor="let coupon of coupons$ | async">
            <div class="card-header">
                <span class="category-badge">{{coupon.category}}</span>
                <button mat-icon-button color="warn" (click)="deleteCoupon(coupon.id)">
                    <mat-icon>delete</mat-icon>
                </button>
            </div>
            <h3>{{coupon.title}}</h3>
            <p class="description">{{coupon.description}}</p>
            <div class="card-footer">
                <span class="price">${{coupon.price}}</span>
                <span class="amount">{{coupon.amount}} left</span>
            </div>
            <div class="dates">
                <small>Expires: {{coupon.endDate | date}}</small>
            </div>
        </div>
    </div>
</div>
